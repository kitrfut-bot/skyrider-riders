plugins {
    id 'com.android.application'
}

android {
    namespace 'com.skyrider.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.skyrider.game'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key so the release APK installs without a keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the game files are already compressed (webp, minified js); keep them stored as they are
    androidResources {
        noCompress 'webp', 'woff2', 'png'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
