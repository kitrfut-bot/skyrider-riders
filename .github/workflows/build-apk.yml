name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the game (offline bundle)
        run: |
          npm install --no-audit --no-fund
          npx vite build

      - name: Copy the game into the APK assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/. android/app/src/main/assets/www/
          test -f android/app/src/main/assets/www/index.html
          ls -R android/app/src/main/assets/www | head -40

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SkyRider.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SkyRider-apk
          path: SkyRider.apk
